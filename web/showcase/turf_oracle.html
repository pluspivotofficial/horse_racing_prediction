<title>TURF ORACLE — 週末競馬AI予想</title>
<style>
/* ============================================================
   TURF ORACLE — "Racing Club" design system
   Refined / editorial. Warm ink + champagne gold + sage green.
   Serif (明朝) display, hairline rules, quiet surfaces.
   Light & dark are each designed (not flipped).
   ============================================================ */
:root{
  --bg:#100e0b; --bg2:#14110d; --surface:#1a1611; --surface2:#211c15;
  --line:#2c2519; --line2:#3b3223;
  --ink:#f3ede1; --ink2:#b3a892; --muted:#7c7360;
  --turf:#8fb79a; --turf-dim:#5c7d67;      /* muted sage racing green */
  --gold:#d9bd7c; --gold-dim:#a8894a; --gold-soft:#efe0bd;  /* champagne */
  --sky:#8fadc4; --violet:#b3a0cf; --coral:#c98d90; --slate:#9a9382;
  --good:#8fb79a; --warn:#d9bd7c; --bad:#c98d90;
  --radius:16px; --radius-sm:11px;
  --shadow:0 18px 50px -30px rgba(0,0,0,.85);
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --num:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;
}
:root[data-theme="light"]{
  --bg:#f4efe4; --bg2:#ece5d6; --surface:#fcf9f2; --surface2:#f4eee2;
  --line:#e2d9c7; --line2:#d2c6ae; --ink:#211d15; --ink2:#5b5344; --muted:#8a8069;
  --turf:#4f7a60; --turf-dim:#6b9179; --gold:#9c7c33; --gold-dim:#b79a58; --gold-soft:#8a6d2c;
  --sky:#5a7d97; --violet:#7a6aa0; --coral:#a5595e; --slate:#8a8269;
  --shadow:0 20px 50px -34px rgba(60,45,20,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1400px 700px at 78% -12%, rgba(217,189,124,.055), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--ink); font-family:var(--sans); line-height:1.62;
  -webkit-font-smoothing:antialiased; min-height:100vh; letter-spacing:.01em;
}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent),color-mix(in srgb,var(--bg) 55%,transparent));
  border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:70px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.06em}
.brand .logo{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:18px;
  background:var(--surface);border:1px solid var(--gold-dim);color:var(--gold)}
.brand small{display:block;font-size:9px;font-weight:600;color:var(--gold-dim);letter-spacing:.32em;font-family:var(--sans);margin-top:2px}
.spacer{flex:1}
.week-badge{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;background:var(--surface);letter-spacing:.04em}
.week-badge b{color:var(--gold);font-weight:600}
.theme-btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:9px;width:40px;height:40px;font-size:15px;transition:.2s}
.theme-btn:hover{border-color:var(--gold-dim);color:var(--gold)}

/* ---- hero ---- */
.hero{padding:52px 0 14px}
.hero h1{font-family:var(--serif);font-size:clamp(30px,4.6vw,46px);line-height:1.28;margin:0 0 14px;font-weight:600;letter-spacing:.02em}
.hero h1 .grad{color:var(--gold);border-bottom:1px solid var(--gold-dim);padding-bottom:2px}
.hero p{color:var(--ink2);margin:0;max-width:600px;font-size:15px;line-height:1.85}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:34px 0 8px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
@media(max-width:760px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);padding:20px 22px;position:relative}
.stat .k{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.stat .v{font-family:var(--num);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:8px;line-height:1;letter-spacing:.01em}
.stat .s{font-size:12px;color:var(--ink2);margin-top:8px;letter-spacing:.02em}
.stat.turf .v{color:var(--turf)} .stat.gold .v{color:var(--gold)} .stat.sky .v{color:var(--sky)}
.stat::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:2px;background:var(--gold-dim);opacity:.5}

/* ---- venue filter ---- */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0 8px;align-items:center}
.chip{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink2);
  border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;transition:.18s;white-space:nowrap;letter-spacing:.03em}
.chip:hover{border-color:var(--gold-dim);color:var(--ink)}
.chip.on{background:var(--gold);color:#2a2008;border-color:var(--gold);font-weight:600}

/* ---- section label ---- */
.section-t{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:32px 0 14px;display:flex;align-items:center;gap:12px}
.section-t::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---- race navigator ---- */
.racebar{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:thin}
.racecard{min-width:184px;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface);padding:15px 16px;transition:.2s;position:relative}
.racecard:hover{border-color:var(--gold-dim);transform:translateY(-2px)}
.racecard.on{border-color:var(--gold);background:var(--surface2)}
.racecard .vn{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.1em}
.racecard .nm{font-family:var(--serif);font-size:15px;font-weight:600;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.racecard .cd{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.racecard .pick{font-size:12px;margin-top:9px;color:var(--gold);font-weight:600;display:flex;gap:5px;align-items:center;letter-spacing:.02em}
.gtag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:transparent;color:var(--gold);border:1px solid var(--gold-dim);position:absolute;top:12px;right:12px;letter-spacing:.08em}
.hitdot{position:absolute;top:12px;right:12px;font-size:12px;opacity:.85}

/* ---- race panel ---- */
.panel{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:30px;margin:8px 0 44px;box-shadow:var(--shadow)}
@media(max-width:640px){.panel{padding:20px}}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;border-bottom:1px solid var(--line);padding-bottom:20px}
.rhead h2{font-family:var(--serif);margin:0;font-size:27px;font-weight:600;letter-spacing:.03em}
.rhead .cond{font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pill{font-size:11px;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);letter-spacing:.05em}
.pill.turf{color:var(--turf);border-color:var(--turf-dim)}
.pill.sky{color:var(--sky);border-color:color-mix(in srgb,var(--sky) 45%,var(--line))}
.pill.gold{color:var(--gold);border-color:var(--gold-dim)}

.banner{display:flex;gap:16px;flex-wrap:wrap;margin:22px 0}
.banner .b{flex:1;min-width:260px;border-radius:var(--radius-sm);padding:16px 18px;font-size:13.5px;line-height:1.75;border:1px solid var(--line);background:var(--surface2)}
.banner .b .lab{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--gold-dim);margin-bottom:7px}
.banner .pace{border-left:2px solid var(--coral)}
.banner .verdict{border-left:2px solid var(--turf-dim)}

/* ---- horse row ---- */
.horse{border:1px solid var(--line);border-radius:var(--radius-sm);margin:11px 0;overflow:hidden;
  background:var(--surface);transition:.2s}
.horse:hover{border-color:var(--line2)}
.horse.win{border-color:var(--gold-dim)}
.hmain{display:grid;grid-template-columns:46px 40px 1fr auto;gap:16px;align-items:center;padding:15px 18px;cursor:pointer}
@media(max-width:640px){.hmain{grid-template-columns:40px 34px 1fr;gap:11px}.hmain .odds-col{grid-column:1/-1;justify-self:start;display:flex;gap:20px;padding-top:6px}}
.mark{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-size:22px;font-weight:600;font-family:var(--serif);border:1px solid transparent}
.mark.m0{color:var(--gold);background:transparent;border-color:var(--gold);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 30%,transparent)}
.mark.m1{color:var(--turf);border-color:var(--turf-dim)}
.mark.m2{color:var(--sky);border-color:color-mix(in srgb,var(--sky) 50%,var(--line))}
.mark.m3{color:var(--ink2);border-color:var(--line2)}
.mark.m4{color:var(--violet);border-color:color-mix(in srgb,var(--violet) 50%,var(--line))}
.mark.mx{color:var(--muted);border-color:var(--line);font-size:14px;font-family:var(--num)}
.num{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-family:var(--num);
  font-size:16px;background:#0c0a07;color:#f3ede1;border:1px solid var(--line2)}
.num.w1{background:#efe9dc;color:#1a1710;border-color:#cabfa5}.num.w2{background:#1b1811;color:#f3ede1}
.num.w3{background:#9c4b4e;color:#fff}.num.w4{background:#4c6b86;color:#fff}.num.w5{background:#c9a24b;color:#241b06}
.num.w6{background:#5c7d67;color:#fff}.num.w7{background:#c07f45;color:#20140a}.num.w8{background:#b57a94;color:#fff}
.hinfo .nm{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:.02em}
.hinfo .jk{font-size:12px;color:var(--ink2);margin-top:2px;letter-spacing:.03em}
.hinfo .jk b{color:var(--ink);font-weight:600}
.abil{height:3px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden;max-width:300px}
.abil>i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.odds-col{display:flex;gap:22px;align-items:center;text-align:right}
.winp{text-align:center}
.winp .p{font-family:var(--num);font-size:25px;font-weight:600;line-height:1;letter-spacing:.01em}
.winp .l{font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.odds{text-align:center}
.odds .p{font-family:var(--num);font-size:17px;font-weight:600}
.odds .l{font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.valtag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:5px;white-space:nowrap;letter-spacing:.04em}
.valtag.pos{color:var(--gold);border:1px solid var(--gold-dim);background:transparent}
.valtag.neg{color:var(--muted);border:1px solid var(--line2)}
.fin{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;border:1px solid var(--line2);color:var(--ink2);letter-spacing:.04em}
.fin.top{color:var(--gold);border-color:var(--gold-dim)}

/* expand */
.hdetail{display:none;padding:2px 18px 20px;border-top:1px solid var(--line);background:var(--surface2)}
.horse.open .hdetail{display:block}
.factorgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 32px;margin:18px 0 8px}
@media(max-width:640px){.factorgrid{grid-template-columns:1fr}}
.frow{display:grid;grid-template-columns:82px 1fr 30px;gap:10px;align-items:center;font-size:12px}
.frow .fl{color:var(--ink2);letter-spacing:.04em}
.frow .ft{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.frow .ft>i{display:block;height:100%;border-radius:99px}
.frow .fv{text-align:right;font-family:var(--num);color:var(--ink2);font-weight:600}
.comments{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.cmt{display:flex;gap:12px;align-items:flex-start;padding:2px 0}
.cmt .ic{font-size:16px;line-height:1.5;width:22px;text-align:center;flex-shrink:0}
.cmt .bd{border-left:1px solid var(--line2);padding-left:12px}
.cmt .bd .nm{font-size:10px;font-weight:700;color:var(--gold-dim);letter-spacing:.14em;text-transform:uppercase;margin-bottom:1px}
.cmt .bd .tx{font-size:13px;color:var(--ink);line-height:1.68}
.cmt.risk .nm{color:var(--coral)} .cmt.value .nm{color:var(--gold)} .cmt.pace .nm{color:var(--coral)}
.cmt.fit .nm{color:var(--turf)} .cmt.workout .nm{color:var(--sky)} .cmt.pedigree .nm{color:var(--violet)}

/* bets */
.betsec{margin-top:32px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.ticket{border:1px solid var(--line);border-radius:var(--radius-sm);padding:17px;background:var(--surface2);position:relative}
.ticket::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:2px;background:var(--gold-dim);opacity:.6}
.ticket.t-単勝::before{background:var(--gold)}.ticket[class*="連複"]::before{background:var(--coral)}
.ticket .tt{display:flex;justify-content:space-between;align-items:baseline}
.ticket .bt{font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:.08em}
.ticket .ev{font-family:var(--num);font-weight:600;font-size:17px;color:var(--ink2)}
.ticket .ev.hi{color:var(--gold)} .ticket .ev.mid{color:var(--turf)}
.ticket .sel{font-family:var(--num);font-size:17px;font-weight:600;margin:10px 0 5px;letter-spacing:.02em}
.ticket .meta{font-size:11px;color:var(--muted);display:flex;gap:14px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.ticket .rat{font-size:12px;color:var(--ink2);margin-top:11px;line-height:1.65}

/* warnings */
.warns{margin-top:26px;border:1px solid var(--line2);border-radius:var(--radius-sm);padding:16px 18px;background:var(--surface2)}
.warns .h{font-size:10px;font-weight:700;color:var(--gold-dim);letter-spacing:.16em;text-transform:uppercase;margin-bottom:9px;display:flex;gap:7px;align-items:center}
.warns ul{margin:0;padding-left:18px}.warns li{font-size:12.5px;color:var(--ink2);margin:4px 0;line-height:1.6}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:36px 0 56px;line-height:2;letter-spacing:.03em}
.foot b{color:var(--ink2);font-weight:600}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:16px;padding-top:16px;border-top:1px solid var(--line);letter-spacing:.04em}
.legend span{display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}


/* ---- earnings simulation ---- */
.simcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin:30px 0;box-shadow:var(--shadow)}
.simcard .sh{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 12px}
.simcard .sh h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:.03em}
.simcard .sh .cap{font-size:11px;color:var(--muted);letter-spacing:.06em}
.simstats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin:18px 0}
@media(max-width:760px){.simstats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:460px){.simstats{grid-template-columns:repeat(2,1fr)}}
.simstat{background:var(--surface2);padding:14px 16px}
.simstat .k{font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.simstat .v{font-family:var(--num);font-size:22px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1}
.simstat .v.up{color:var(--turf)} .simstat .v.down{color:var(--coral)} .simstat .v.gold{color:var(--gold)}
.equity{width:100%;height:auto;display:block;margin:10px 0 4px}
.eqlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.bytype{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.btrow{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--surface2)}
.btrow .n{font-size:11px;color:var(--ink2);display:flex;justify-content:space-between;letter-spacing:.03em}
.btrow .bar{height:3px;background:var(--line);border-radius:99px;margin:8px 0 6px;overflow:hidden}
.btrow .bar>i{display:block;height:100%;border-radius:99px}
.btrow .roi{font-family:var(--num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.simnote{font-size:12px;color:var(--ink2);margin-top:16px;line-height:1.75;border-left:2px solid var(--gold-dim);padding-left:13px}


/* ===== 擬似体験ウォレット & ベット ===== */
.wallet-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--gold-dim);border-radius:999px;padding:7px 14px 7px 12px;cursor:pointer;background:var(--surface);transition:.2s}
.wallet-chip:hover{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 12%,transparent)}
.wallet-chip .coin{font-size:15px}
.wallet-chip .bal{font-family:var(--num);font-weight:600;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wallet-chip .dl{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.wallet-chip .dl.up{color:var(--turf)} .wallet-chip .dl.down{color:var(--coral)}
@media(max-width:520px){.wallet-chip .dl{display:none}}

.betbtn{border:1px solid var(--gold-dim);background:transparent;color:var(--gold);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:.15s;white-space:nowrap}
.betbtn:hover{background:var(--gold);color:#2a2008}

/* bet tray */
#bettray{margin-bottom:6px}
.tray{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface2);padding:15px 17px}
.tray .mybet{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.tray .mybet:last-of-type{border:none}
.tray .mybet .r{font-family:var(--num);font-weight:600;white-space:nowrap}
.tray .mybet .r.won{color:var(--turf)} .tray .mybet .r.lost{color:var(--muted)} .tray .mybet .r.pend{color:var(--gold-dim)}
.tray .empty{color:var(--muted);font-size:13px;line-height:1.7}
.tray .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.reveal-btn{border:none;background:linear-gradient(100deg,var(--gold),var(--gold-soft));color:#2a2008;border-radius:11px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;font-family:var(--sans);flex:1;min-width:200px}
.reveal-btn:hover{filter:brightness(1.05)}

/* bet slip bottom sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,4,3,.55);z-index:150;opacity:0;pointer-events:none;transition:.28s}
.backdrop.on{opacity:1;pointer-events:auto}
.betslip{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(460px,96vw);
  background:var(--surface);border:1px solid var(--line2);border-bottom:none;border-radius:20px 20px 0 0;
  box-shadow:0 -24px 70px -24px rgba(0,0,0,.7);padding:24px 24px 30px;z-index:200;transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.betslip.open{transform:translate(-50%,0)}
.bs-close{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:16px;background:none;border:none}
.betslip h4{font-family:var(--serif);font-size:19px;margin:0 0 3px;font-weight:600}
.betslip .sub{font-size:12px;color:var(--ink2);margin-bottom:16px}
.bs-toggle{display:flex;gap:8px;margin-bottom:16px}
.bs-toggle button{flex:1;border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:10px;padding:11px;font-weight:700;cursor:pointer;font-size:13px;font-family:var(--sans)}
.bs-toggle button.on{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.bs-amt{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.bs-amt .lab{font-size:11px;color:var(--muted);letter-spacing:.1em}
.bs-amt .a{font-family:var(--num);font-size:28px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.bs-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bs-chips button{border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:9px;padding:9px 13px;font-family:var(--num);font-weight:600;cursor:pointer;font-size:13px}
.bs-chips button:hover{border-color:var(--gold-dim)}
.bs-pot{font-size:12.5px;color:var(--ink2);margin-bottom:16px;min-height:18px}
.bs-pot b{color:var(--turf);font-family:var(--num)}
.bs-go{width:100%;border:none;background:var(--gold);color:#2a2008;border-radius:12px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;font-family:var(--sans)}
.bs-go:disabled{opacity:.4;cursor:not-allowed}

/* reveal overlay */
.reveal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(6,5,3,.86);backdrop-filter:blur(7px);padding:20px}
.reveal.on{display:flex}
.reveal .card{text-align:center;max-width:400px;animation:rvpop .4s cubic-bezier(.2,.9,.3,1.2)}
.reveal .run{font-size:66px;animation:gallop .55s ease-in-out infinite}
@keyframes gallop{0%,100%{transform:translateX(-12px) rotate(-3deg)}50%{transform:translateX(12px) rotate(3deg)}}
@keyframes rvpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.reveal .amt{font-family:var(--num);font-size:clamp(38px,10vw,54px);font-weight:800;line-height:1;margin:6px 0}
.reveal .amt.win{color:var(--gold);text-shadow:0 0 30px color-mix(in srgb,var(--gold) 40%,transparent)}
.reveal .amt.lose{color:var(--ink2)}
.reveal .detail{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.9;text-align:left;display:inline-block}
.reveal .rvgo{margin-top:20px;border:none;background:var(--gold);color:#2a2008;border-radius:12px;padding:13px 30px;font-weight:800;cursor:pointer;font-family:var(--sans);font-size:14px}

/* toast */
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--surface);border:1px solid var(--gold-dim);color:var(--ink);padding:13px 22px;border-radius:12px;z-index:400;opacity:0;pointer-events:none;transition:.3s;font-size:13px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* coins */
.coinfx{position:fixed;top:-30px;z-index:350;font-size:22px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}

/* wallet modal */
.wmodal{position:fixed;inset:0;z-index:250;display:none;align-items:flex-start;justify-content:center;padding:80px 16px;background:rgba(5,4,3,.55)}
.wmodal.on{display:flex}
.wmbox{background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:24px;width:min(440px,96vw);max-height:76vh;overflow:auto;box-shadow:var(--shadow)}
.wmbox h4{font-family:var(--serif);font-size:20px;margin:0 0 4px;font-weight:600}
.wmbox .big{font-family:var(--num);font-size:32px;font-weight:700;color:var(--gold);margin:6px 0}
.wmbox .pl{font-size:13px;font-family:var(--num);font-weight:600}
.wmbox .pl.up{color:var(--turf)} .wmbox .pl.down{color:var(--coral)}
.wmbox .hist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.wmbox .hrow{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;color:var(--ink2);gap:10px}
.wmbox .hrow .v{font-family:var(--num);font-weight:600;white-space:nowrap}
.wmbtns{display:flex;gap:10px;margin-top:18px}
.wmbtns button{flex:1;border:1px solid var(--line2);background:transparent;color:var(--ink2);border-radius:10px;padding:11px;cursor:pointer;font-weight:700;font-size:13px;font-family:var(--sans)}
.wmbtns button.reset{border-color:var(--coral);color:var(--coral)}

<script>
/* ===================== renderer ===================== */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const FLAB = {recent_form:'近走成績',class_fit:'クラス実績',distance_fit:'距離適性',course_fit:'コース適性',
  surface_fit:'馬場適性',going_fit:'馬場状態',weather_fit:'天候相性',jockey_fit:'騎手相性',
  pace_fit:'脚質決め手',workout:'追い切り',pedigree:'血統',draw_fit:'枠順',condition:'馬体調子'};
const FORD = ['recent_form','class_fit','workout','distance_fit','course_fit','jockey_fit','pace_fit','pedigree','going_fit','weather_fit','surface_fit','condition','draw_fit'];
const state = {venue:'ALL', race:0};

function wakuClass(no,field){ // approximate gate colour from horse number
  if(!no||!field) return ''; const w=Math.min(8,Math.ceil(no/Math.ceil(field/8)||1)); return 'w'+w; }
function fc(v){ // factor bar colour by magnitude (single-hue, thresholds are secondary encoding via shade)
  if(v>=60) return 'var(--turf)'; if(v>=52) return 'var(--turf-dim)'; if(v>=46) return 'var(--slate)'; return 'var(--coral)'; }
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* -- backtest / headline stats -- */
const GRANK={GI:6,GII:5,GIII:4,L:3,OP:3,'':0};
function computeStats(){
  const races=DATA.races; let scored=0,winHit=0,plcHit=0,bestVal=null,roi=0,roiN=0,marquee=null,topPick=null;
  races.forEach(rp=>{
    const res=rp.race.result||{}; const has=Object.keys(res).length>0;
    const top=rp.horses[0];
    if(has&&top){ scored++; const f=res[top.horse_id];
      if(f===1) winHit++; if(f&&f<=3) plcHit++;
      if(top.odds){ roiN++; roi += (f===1? top.odds:0); }
    }
    rp.horses.forEach(h=>{ if(h.value!=null && (!bestVal||h.value>bestVal.value)) bestVal={...h,race:rp.race}; });
    if(!marquee||(GRANK[rp.race.grade]||0)>(GRANK[marquee.race.grade]||0)||((GRANK[rp.race.grade]||0)===(GRANK[marquee.race.grade]||0)&&(rp.race.field_size||0)>(marquee.race.field_size||0))) marquee=rp;
    if(top&&(!topPick||top.win_prob>topPick.win_prob)) topPick={...top,race:rp.race};
  });
  return {n:races.length,scored,winHit,plcHit,bestVal,marquee,topPick,
    roi: roiN? Math.round(roi/roiN*100):null,
    winPct: scored? Math.round(winHit/scored*100):null,
    plcPct: scored? Math.round(plcHit/scored*100):null};
}
function renderStats(){
  const s=computeStats();
  const cards=[];
  cards.push([s.scored?'分析レース数':'予想レース数',s.n,DATA.venues.join(' / '),'turf']);
  if(s.scored){
    cards.push(['◎の複勝的中率', s.plcPct+'%', `本命が3着内 ${s.plcHit}/${s.scored}R`,'gold']);
    cards.push(['◎の単勝的中率', s.winPct+'%', `本命が勝利 ${s.winHit}/${s.scored}R`,'sky']);
  }else{
    if(s.marquee){const m=s.marquee.race;cards.push(['今週の注目', (m.name||'').slice(0,7), `${m.venue}${m.race_no}R ${m.grade||''} ${m.surface||''}${m.distance||''}m`,'gold']);}
    if(s.topPick){cards.push(['最有力の本命', s.topPick.horse_name.slice(0,7), `${s.topPick.race.venue}${s.topPick.race.race_no}R・勝率${Math.round(s.topPick.win_prob*100)}%`,'sky']);}
  }
  if(s.bestVal && s.bestVal.value>0){
    cards.push(['今週の妙味No.1', s.bestVal.horse_name.slice(0,7), `${s.bestVal.race.venue}${s.bestVal.race.race_no}R・EV${(s.bestVal.win_prob*s.bestVal.odds).toFixed(2)}`,'gold']);
  }else{
    cards.push([s.scored?'推奨馬券':'ファクター数', s.scored?'自動生成':'13', s.scored?'単複〜3連複まで':'多角的にスコアリング','turf']);
  }
  document.getElementById('statGrid').innerHTML=cards.slice(0,4).map(c=>
    `<div class="stat ${c[3]}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${esc(c[2])}</div></div>`).join('');
}

function renderVenues(){
  const vs=['ALL',...DATA.venues];
  document.getElementById('venueFilter').innerHTML=vs.map(v=>
    `<div class="chip ${state.venue===v?'on':''}" data-v="${v}">${v==='ALL'?'すべての開催':v+'競馬場'}</div>`).join('');
  document.querySelectorAll('#venueFilter .chip').forEach(c=>c.onclick=()=>{
    state.venue=c.dataset.v; const list=filtered(); state.race=list.length?DATA.races.indexOf(list[0]):0; renderAll();});
}
function filtered(){ return DATA.races.filter(r=>state.venue==='ALL'||r.race.venue===state.venue); }

function renderRaceBar(){
  const list=filtered();
  document.getElementById('raceBar').innerHTML=list.map(rp=>{
    const i=DATA.races.indexOf(rp); const r=rp.race,top=rp.horses[0];
    const res=r.result||{}; let hit='';
    if(Object.keys(res).length && top){ const f=res[top.horse_id]; hit=`<span class="hitdot">${f===1?'🎯':f&&f<=3?'✅':'—'}</span>`;}
    else{ hit=`<span class="hitdot" title="発走前">🕒</span>`; }
    const g=r.grade&&r.grade!=='OP'?`<span class="gtag">${r.grade}</span>`:(r.grade==='OP'?'<span class="gtag" style="background:var(--slate)">OP</span>':'');
    return `<div class="racecard ${state.race===i?'on':''}" data-i="${i}">
      ${g||hit}
      <div class="vn">${r.venue} ${r.race_no}R</div>
      <div class="nm">${esc(r.name||'—')}</div>
      <div class="cd">${r.surface||''}${r.distance||''}m ${r.off_time||''}</div>
      <div class="pick">${top?top.confidence+' '+esc(top.horse_name.slice(0,8)):''}</div>
    </div>`;}).join('');
  document.querySelectorAll('#raceBar .racecard').forEach(c=>c.onclick=()=>{state.race=+c.dataset.i;renderAll();});
}

function factorBars(h){
  return FORD.filter(k=>k in h.factors).map(k=>{
    const v=h.factors[k];
    return `<div class="frow"><span class="fl">${FLAB[k]}</span>
      <span class="ft"><i style="width:${Math.max(4,Math.min(100,v))}%;background:${fc(v)}"></i></span>
      <span class="fv">${Math.round(v)}</span></div>`;}).join('');
}
function comments(h){
  if(!h.comments||!h.comments.length) return '';
  return `<div class="comments">${h.comments.map(c=>
    `<div class="cmt ${c.persona}"><div class="ic">${c.icon}</div>
     <div class="bd"><div class="nm">${esc(c.name)}</div><div class="tx">${esc(c.text)}</div></div></div>`).join('')}</div>`;
}
function horseRow(h,r,idx){
  const res=r.result||{}; const fin=res[h.horse_id];
  const mk=['m0','m1','m2','m3','m4'][idx]||'mx';
  const val=h.value; const vtag = h.odds? (val>0.05?`<span class="valtag pos">妙味 +${(val*100).toFixed(0)}%</span>`
      : `<span class="valtag neg">妙味 ${(val*100).toFixed(0)}%</span>`):'';
  const finTag = fin? `<span class="fin ${fin<=3?'top':''}">実${fin}着</span>`:'';
  return `<div class="horse ${fin===1?'win':''}" data-h="${idx}">
    <div class="hmain">
      <div class="mark ${mk}">${h.confidence||idx+1}</div>
      <div class="num ${wakuClass(h.horse_no,r.field_size)}">${h.horse_no||'-'}</div>
      <div class="hinfo">

function money(n){return (n<0?'−':'')+'¥'+Math.abs(Math.round(n)).toLocaleString();}
function renderSim(){
  const s=DATA.simulation; const el=document.getElementById('sim');
  if(!s||!s.n_bets){el.innerHTML='';return;}
  const up=s.profit>=0;
  const c=s.equity_curve, W=820, H=170, pad=14;
  const ys=c.map(p=>p.bankroll).concat([s.bankroll_start]);
  const mn=Math.min(...ys), mx=Math.max(...ys), span=(mx-mn)||1;
  const X=i=>pad+i*(W-2*pad)/(c.length-1);
  const Y=v=>H-pad-(v-mn)/span*(H-2*pad);
  const line=c.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.bankroll).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)},${(H-pad).toFixed(1)} `+c.map((p,i)=>`L${X(i).toFixed(1)},${Y(p.bankroll).toFixed(1)}`).join(' ')+` L${X(c.length-1).toFixed(1)},${(H-pad).toFixed(1)} Z`;
  const baseY=Y(s.bankroll_start).toFixed(1);
  const endUp=c[c.length-1].bankroll>=s.bankroll_start;
  const stroke=endUp?'var(--turf)':'var(--coral)';
  const svg=`<svg class="equity" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="資金推移">
    <defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${stroke}" stop-opacity="0.20"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${baseY}" x2="${W-pad}" y2="${baseY}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="${area}" fill="url(#eqg)"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(c.length-1).toFixed(1)}" cy="${Y(c[c.length-1].bankroll).toFixed(1)}" r="4" fill="${stroke}"/>
  </svg>`;
  const stat=(k,v,cls)=>`<div class="simstat"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`;
  const bt=Object.entries(s.by_type).sort((a,b)=>b[1].return-a[1].return).map(([name,v])=>{
    const roi=v.roi*100, w=Math.max(3,Math.min(100,roi/6));
    const col=roi>=100?'var(--turf)':roi>=60?'var(--gold)':'var(--coral)';
    return `<div class="btrow"><div class="n"><span>${name.replace('フォーメーション','F')}</span><span>的中${v.hits}/${v.bets}</span></div>
      <div class="bar"><i style="width:${w}%;background:${col}"></i></div>
      <div class="n"><span class="roi" style="color:${col}">回収率 ${roi.toFixed(0)}%</span><span>${money(v.return)}</span></div></div>`;}).join('');
  const led=[...s.ledger].sort((a,b)=>b.profit-a.profit);
  const top2=led.slice(0,2).reduce((a,r)=>a+r.profit,0);
  const fuku=s.by_type['複勝'], wide=s.by_type['ワイド'];
  const steady=[fuku,wide].filter(Boolean).map(v=>`${v===fuku?'複勝':'ワイド'}${Math.round(v.roi*100)}%`).join('・');
  let note=`※ 対象${DATA.race_count}レースを推奨どおり実際に購入した場合を、<b>実際の払戻(配当)</b>で精算した結果です（1点=${s.unit_yen}円・元手${money(s.bankroll_start)}）。`;
  if(s.profit>=0){
    note+=`ただし1週末のみで分散は大きく、利益${money(s.profit)}のうち${money(top2)}は${led[0].race.split(' ')[0]}等・上位2レースの的中に依存します。`+(fuku?`堅実志向なら複勝中心（回収率${Math.round(fuku.roi*100)}%）が目安。`:'');
  }else{
    note+=`今週は妙味狙いの単勝・3連複などが外れ収支は${money(s.profit)}。一方で堅実な${steady||'複勝'}は健闘しており、券種の選び方次第で結果は大きく変わります。`;
  }
  note+=`長期の安定した回収率評価には複数週の検証が必要です。馬券は自己責任で。`;
  el.innerHTML=`<div class="simcard">
    <div class="sh"><h3>🤖 AIにまるごと乗ったら（実績）</h3><span class="cap">AIの推奨を全部・実配当で精算 ・ ${s.n_bets}点</span></div>
    <div class="simstats">
      ${stat('投資額', money(s.staked))}
      ${stat('回収額', money(s.returned),'gold')}
      ${stat('収支', (up?'+':'')+money(s.profit).replace('¥',''),up?'up':'down')}
      ${stat('回収率', (s.roi*100).toFixed(0)+'%', up?'up':'down')}
      ${stat('的中率', (s.hit_rate*100).toFixed(0)+'%')}
    </div>
    ${svg}
    <div class="eqlabels"><span>元手 ${money(s.bankroll_start)}</span><span>最大ドローダウン −${money(s.max_drawdown).replace('¥','¥')} ／ 最終 ${money(s.bankroll_end)}</span></div>
    <div class="bytype">${bt}</div>
    <div class="simnote">${note}</div>
  </div>`;
}

/* --- bet slip --- */
let SLIP=null;
function openSlip(rid,hno){const rp=DATA.races.find(x=>x.race.race_id===rid);if(!rp)return;
  const h=rp.horses.find(x=>String(x.horse_no)===String(hno));if(!h)return;

function closeSlip(){document.getElementById('betslip').classList.remove('open');document.getElementById('backdrop').classList.remove('on');SLIP=null;}
function renderSlip(){if(!SLIP)return;const {h,rp,type,amt}=SLIP;const r=rp.race;
  const pot=type==='単勝'&&h.odds?`的中で <b>${money(amt*h.odds)}</b>（×${h.odds.toFixed(1)}）`:'的中で払戻（配当は結果で確定）';
  const over=amt>WALLET.balance;
  document.getElementById('slipBody').innerHTML=
   `<h4>${h.confidence||''} ${esc(h.horse_name)}</h4>
    <div class="sub">${r.venue}${r.race_no}R ${esc(r.name||'')} ・ ${h.horse_no}番 ／ 残高 ${money(WALLET.balance)}</div>
    <div class="bs-toggle">
      <button data-t="単勝" class="${type==='単勝'?'on':''}">単勝（1着）</button>

    <div class="bs-chips">${[100,500,1000,3000,5000].map(v=>`<button data-amt="${v}">+${v.toLocaleString()}</button>`).join('')}<button data-amt="clear" style="color:var(--coral)">クリア</button></div>
    <div class="bs-pot">${pot}</div>
    <button class="bs-go" ${amt<=0||over?'disabled':''}>${over?'残高が足りません':`${money(amt)}を賭ける`}</button>`;}
function confirmBet(){if(!SLIP)return;const {h,rp,type,amt}=SLIP;const r=rp.race;
  if(amt<=0||amt>WALLET.balance){toast('金額を確認してください');return;}
  WALLET.balance-=amt;
  WALLET.bets.push({id:'b'+Date.now()+Math.floor(Math.random()*1e4),raceId:r.race_id,
    raceName:`${r.venue}${r.race_no}R ${r.name||''}`,payKey:type,label:`${type} ${h.horse_no} ${h.horse_name}`,
    combos:[[h.horse_no]],stake:amt,odds:h.odds||null,status:'pending',payout:0,ts:Date.now()});
  saveWallet();closeSlip();toast(`${money(amt)}を「${type}・${h.horse_name}」に投票`);renderPanel();}

function aiBuyAll(rid){const rp=DATA.races.find(x=>x.race.race_id===rid);if(!rp)return;let n=0,cost=0;
  (rp.bets||[]).forEach(b=>{const stake=Math.round(b.stake_units*100);if(stake<=0||stake>WALLET.balance)return;
    WALLET.balance-=stake;cost+=stake;n++;
    WALLET.bets.push({id:'b'+Date.now()+Math.floor(Math.random()*1e4),raceId:rid,
      raceName:`${rp.race.venue}${rp.race.race_no}R ${rp.race.name||''}`,payKey:b.pay_key,
      label:`${b.bet_type} ${b.selection}`,combos:b.combos||[],stake,odds:null,status:'pending',payout:0,ts:Date.now()});});
  saveWallet();toast(n?`AI推奨${n}点（${money(cost)}）を購入`:'購入できる推奨がありません');renderPanel();}

/* --- settle + reveal --- */
function settleAndReveal(rid){const rp=DATA.races.find(x=>x.race.race_id===rid);const payouts=rp.race.payouts||{};
  const pend=WALLET.bets.filter(b=>b.raceId===rid&&b.status==='pending');
  if(!pend.length){toast('このレースの馬券がありません');return;}
  if(!Object.keys(rp.race.result||{}).length){toast('発走前です（結果確定後に精算）');return;}
  pend.forEach(b=>{const tbl={};(payouts[b.payKey]||[]).forEach(row=>{tbl[row.combo.slice().sort((x,y)=>x-y).join('-')]=row.yen;});
    const combos=b.combos&&b.combos.length?b.combos:[[]];const per=b.stake/combos.length;let ret=0;
    combos.forEach(c=>{const k=c.slice().sort((x,y)=>x-y).join('-');if(tbl[k])ret+=tbl[k]/100*per;});
    b.status=ret>0?'won':'lost';b.payout=Math.round(ret);});
  const stake=pend.reduce((a,b)=>a+b.stake,0),ret=pend.reduce((a,b)=>a+b.payout,0);
  runReveal(rp,pend,stake,ret);}
function runReveal(rp,bets,stake,ret){const ov=document.getElementById('reveal'),body=document.getElementById('revealBody');
  ov.classList.add('on');
  body.innerHTML=`<div class="card"><div class="run">🐎</div><div style="color:var(--ink2);letter-spacing:.24em;margin-top:14px;font-size:13px">レース中…</div></div>`;
  setTimeout(()=>{const win=ret>0,net=ret-stake;
    const winId=Object.keys(rp.race.result).find(hid=>rp.race.result[hid]===1);
    const wname=(rp.horses.find(h=>h.horse_id===winId)||{}).horse_name||'';
    body.innerHTML=`<div class="card">
      <div style="font-size:44px">${win?'🎉':'🥕'}</div>
      <div style="font-size:12px;color:var(--muted);letter-spacing:.16em;margin:10px 0 2px">1着 ${esc(wname)}</div>
      <div class="amt ${win?'win':'lose'}">${win?'+':''}${money(ret)}</div>
      <div style="font-size:13px;color:var(--ink2);margin-top:8px">投資 ${money(stake)} → 払戻 ${money(ret)}（収支 ${net>=0?'+':'−'}${money(Math.abs(net))}）</div>
      <div class="detail">${bets.map(b=>`<div>${b.status==='won'?'✅':'✗'} ${esc(b.label)} … <b style="color:${b.status==='won'?'var(--turf)':'var(--muted)'}">${b.payout?money(b.payout):'0'}</b></div>`).join('')}</div>
      <div><button class="rvgo" id="rvClose">受け取る（残高に反映）</button></div></div>`;
    document.getElementById('rvClose').onclick=()=>{const from=WALLET.balance;WALLET.balance+=ret;saveWallet();
      countUp(from,WALLET.balance);ov.classList.remove('on');if(win)burstCoins();renderPanel();};},1350);}
function countUp(from,to){const el=document.getElementById('walletChip');if(!el)return;const bal=el.querySelector('.bal');
  const steps=26;let i=0;const st=(to-from)/steps;const t=setInterval(()=>{i++;bal.textContent=money(from+st*i);
    if(i>=steps){bal.textContent=money(to);clearInterval(t);renderWalletChip();}},22);}
function burstCoins(){for(let i=0;i<16;i++){const c=document.createElement('div');c.className='coinfx';c.textContent='🪙';
  c.style.left=(Math.random()*100)+'vw';c.style.animationDuration=(1.6+Math.random()*1.4)+'s';document.body.appendChild(c);
  setTimeout(()=>c.remove(),3200);}}

    const a=e.target.closest('[data-amt]');if(a){SLIP.amt=a.dataset.amt==='clear'?0:(SLIP.amt||0)+parseInt(a.dataset.amt);renderSlip();return;}
    if(e.target.closest('.bs-go')){confirmBet();return;}
    if(e.target.closest('.bs-close')){closeSlip();return;}});
  document.getElementById('backdrop').addEventListener('click',closeSlip);
  document.getElementById('walletChip').addEventListener('click',openWallet);
  renderWalletChip();
}

renderStats();renderSim();renderAll();renderFoot();initWallet();
</script>
