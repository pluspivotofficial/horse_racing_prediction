<title>TURF ORACLE — 週末競馬AI予想</title>
<style>
/* ============================================================
   TURF ORACLE — design system  ("turf night" theme)
   Dark-first, designed (not flipped) for light too.
   ============================================================ */
:root{
  --bg:#070b0a; --bg2:#0c1613; --surface:#101d19; --surface2:#16261f;
  --line:#213730; --line2:#2c463c;
  --ink:#eafff6; --ink2:#a9c6ba; --muted:#6f8a80;
  --turf:#1fe38b; --turf-dim:#0f8f57;
  --gold:#ffcf5c; --gold-dim:#c99a2e;
  --sky:#5cb3ff; --violet:#b58cff; --coral:#ff6b7d; --slate:#8ba3b8;
  --good:#1fe38b; --warn:#ffcf5c; --bad:#ff6b7d;
  --radius:20px; --radius-sm:12px;
  --shadow:0 10px 40px -12px rgba(0,0,0,.7);
  --mono:"SFMono-Regular",ui-monospace,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef4f1; --bg2:#e4ede9; --surface:#ffffff; --surface2:#f4f8f6;
  --line:#d6e2dc; --line2:#c2d3ca; --ink:#0c1a15; --ink2:#42574e; --muted:#7c8f86;
  --turf:#08a35d; --turf-dim:#0a7d49; --gold:#c58a12; --shadow:0 10px 30px -14px rgba(20,60,45,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(31,227,139,.10), transparent 60%),
    radial-gradient(900px 500px at 0% 0%, rgba(92,179,255,.07), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--ink); font-family:var(--sans); line-height:1.55;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(7,11,10,.92),rgba(7,11,10,.62));
  border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(238,244,241,.95),rgba(238,244,241,.7))}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:19px}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;
  background:conic-gradient(from 210deg,var(--turf),var(--gold),var(--turf));box-shadow:0 0 22px -4px var(--turf)}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--turf);letter-spacing:.18em}
.spacer{flex:1}
.week-badge{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;background:var(--surface)}
.week-badge b{color:var(--gold)}
.theme-btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:10px;width:38px;height:38px;font-size:16px}

/* ---- hero ---- */
.hero{padding:34px 0 12px}
.hero h1{font-size:clamp(26px,4.4vw,40px);line-height:1.12;margin:0 0 6px;font-weight:850;letter-spacing:-.01em}
.hero h1 .grad{background:linear-gradient(100deg,var(--turf),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ink2);margin:0;max-width:640px;font-size:15px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0 8px}
@media(max-width:760px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.stat{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.stat .v{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;margin-top:4px;font-family:var(--mono)}
.stat .s{font-size:12px;color:var(--ink2);margin-top:2px}
.stat.turf .v{color:var(--turf)} .stat.gold .v{color:var(--gold)} .stat.sky .v{color:var(--sky)}
.stat::after{content:"";position:absolute;right:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(31,227,139,.16),transparent 70%)}

/* ---- venue filter ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 8px;align-items:center}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--turf-dim);color:var(--ink)}
.chip.on{background:var(--turf);color:#062015;border-color:var(--turf);box-shadow:0 0 18px -6px var(--turf)}

/* ---- race navigator ---- */
.section-t{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:26px 0 12px}
.racebar{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.racecard{min-width:172px;cursor:pointer;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:linear-gradient(180deg,var(--surface),var(--surface2));padding:12px 14px;transition:.18s;position:relative}
.racecard:hover{transform:translateY(-2px);border-color:var(--turf-dim)}
.racecard.on{border-color:var(--turf);box-shadow:var(--shadow),0 0 0 1px var(--turf) inset}
.racecard .vn{font-size:12px;color:var(--ink2);font-weight:700}
.racecard .nm{font-size:14px;font-weight:800;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.racecard .cd{font-size:11px;color:var(--muted);font-family:var(--mono)}
.racecard .pick{font-size:12px;margin-top:7px;color:var(--gold);font-weight:700;display:flex;gap:4px;align-items:center}
.gtag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--gold);color:#241a00;position:absolute;top:10px;right:10px}
.hitdot{position:absolute;top:10px;right:10px;font-size:11px}

/* ---- race panel ---- */
.panel{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;margin:6px 0 40px;box-shadow:var(--shadow)}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;border-bottom:1px solid var(--line);padding-bottom:16px}
.rhead h2{margin:0;font-size:23px;font-weight:850}
.rhead .cond{font-size:13px;color:var(--ink2);font-family:var(--mono);display:flex;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.pill.turf{color:var(--turf);border-color:var(--turf-dim)}
.pill.sky{color:var(--sky);border-color:#2a4a66}
.pill.gold{color:var(--gold);border-color:var(--gold-dim)}

.banner{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.banner .b{flex:1;min-width:240px;border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;border:1px solid var(--line)}
.banner .b .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:3px}
.banner .pace{background:linear-gradient(100deg,rgba(255,107,125,.12),transparent);border-color:#4a2830}
.banner .verdict{background:linear-gradient(100deg,rgba(31,227,139,.10),transparent);border-color:#1c4a38}

/* ---- horse row ---- */
.horse{border:1px solid var(--line);border-radius:var(--radius-sm);margin:10px 0;overflow:hidden;
  background:var(--surface);transition:.18s}
.horse:hover{border-color:var(--line2)}
.horse.win{box-shadow:0 0 0 1px var(--gold) inset,0 0 26px -10px var(--gold)}
.hmain{display:grid;grid-template-columns:44px 40px 1fr auto;gap:14px;align-items:center;padding:13px 16px;cursor:pointer}
@media(max-width:640px){.hmain{grid-template-columns:38px 34px 1fr;gap:10px}.hmain .odds-col{grid-column:1/-1;justify-self:start;display:flex;gap:14px;padding-top:4px}}
.mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800}
.mark.m0{color:#241a00;background:var(--gold);box-shadow:0 0 18px -4px var(--gold)}
.mark.m1{color:#062015;background:var(--turf)}
.mark.m2{color:#04121f;background:var(--sky)}
.mark.m3{color:var(--ink);background:var(--surface2);border:1px solid var(--line2)}
.mark.m4{color:#1a0f2e;background:var(--violet)}
.mark.mx{color:var(--muted);background:var(--surface2);font-size:14px}
.num{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-family:var(--mono);
  font-size:16px;background:#0a0f0d;color:#fff;border:1px solid var(--line2)}
/* gate/waku colors */
.num.w1{background:#f4f4f4;color:#111}.num.w2{background:#111;color:#fff}.num.w3{background:#e5484d;color:#fff}
.num.w4{background:#2b7fff;color:#fff}.num.w5{background:#f5c518;color:#111}.num.w6{background:#1fbf6b;color:#fff}
.num.w7{background:#ff8f2b;color:#111}.num.w8{background:#ff7bb0;color:#111}
.hinfo .nm{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.hinfo .jk{font-size:12px;color:var(--ink2)}
.hinfo .jk b{color:var(--ink)}
.abil{height:6px;border-radius:99px;background:var(--surface2);margin-top:6px;overflow:hidden;max-width:280px}
.abil>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--turf-dim),var(--turf))}
.odds-col{display:flex;gap:16px;align-items:center;text-align:right}
.winp{text-align:center}
.winp .p{font-size:22px;font-weight:850;font-family:var(--mono);line-height:1}
.winp .l{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.odds{text-align:center}
.odds .p{font-size:16px;font-weight:800;font-family:var(--mono)}
.odds .l{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.valtag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap}
.valtag.pos{color:#062015;background:var(--turf)}
.valtag.neg{color:var(--ink2);background:var(--surface2);border:1px solid var(--line2)}
.fin{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--surface2);border:1px solid var(--line2)}
.fin.top{color:#241a00;background:var(--gold)}

/* expand */
.hdetail{display:none;padding:0 16px 16px;border-top:1px solid var(--line);background:var(--surface2)}
.horse.open .hdetail{display:block}
.factorgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin:14px 0 6px}
@media(max-width:640px){.factorgrid{grid-template-columns:1fr}}
.frow{display:grid;grid-template-columns:88px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.frow .fl{color:var(--ink2)}
.frow .ft{height:7px;border-radius:99px;background:#0a0f0d;overflow:hidden}
.frow .ft>i{display:block;height:100%;border-radius:99px}
.frow .fv{text-align:right;font-family:var(--mono);color:var(--ink2);font-weight:700}
.comments{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cmt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px}
.cmt .ic{font-size:17px;line-height:1.4}
.cmt .bd .nm{font-size:11px;font-weight:800;color:var(--turf);letter-spacing:.03em}
.cmt .bd .tx{font-size:13px;color:var(--ink);line-height:1.5}
.cmt.risk .nm{color:var(--coral)} .cmt.value .nm{color:var(--gold)} .cmt.pace .nm{color:var(--sky)} .cmt.fit .nm{color:var(--violet)}

/* bets */
.betsec{margin-top:26px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ticket{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;background:linear-gradient(180deg,var(--surface),var(--surface2));position:relative;overflow:hidden}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--turf)}
.ticket.t-単勝::before{background:var(--gold)}.ticket.t-複勝::before{background:var(--turf)}
.ticket.t-ワイド::before{background:var(--sky)}.ticket.t-馬連::before{background:var(--violet)}
.ticket[class*="連複"]::before{background:var(--coral)}
.ticket .tt{display:flex;justify-content:space-between;align-items:center}
.ticket .bt{font-size:12px;font-weight:800;letter-spacing:.05em}
.ticket .ev{font-family:var(--mono);font-weight:800;font-size:15px}
.ticket .ev.hi{color:var(--turf)} .ticket .ev.mid{color:var(--gold)}
.ticket .sel{font-size:16px;font-weight:850;margin:8px 0 4px;font-family:var(--mono)}
.ticket .meta{font-size:11px;color:var(--muted);display:flex;gap:12px;font-family:var(--mono)}
.ticket .rat{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.5}

/* warnings */
.warns{margin-top:22px;border:1px dashed var(--gold-dim);border-radius:var(--radius-sm);padding:14px 16px;
  background:rgba(255,207,92,.05)}
.warns .h{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.06em;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.warns ul{margin:0;padding-left:18px}.warns li{font-size:13px;color:var(--ink2);margin:3px 0}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:30px 0 50px;line-height:1.8}
.foot b{color:var(--ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
</style>

<div class="topbar"><div class="wrap">
  <div class="brand"><span class="logo">🐎</span><span>TURF ORACLE<small>WEEKEND RACING AI</small></span></div>
  <span class="spacer"></span>
  <span class="week-badge" id="weekBadge">今週末を予想</span>
  <button class="theme-btn" id="themeBtn" title="テーマ切替">◐</button>
</div></div>

<div class="wrap">
  <section class="hero">
    <h1>今週末の勝ち馬を、<span class="grad">データで撃ち抜く。</span></h1>
    <p>過去戦績・騎手相性・コース適性・馬場・天候まで、11のファクターをAIが多角的に分析。「なぜ買えるのか」を毎レース言語化してお届けします。</p>
    <div class="statgrid" id="statGrid"></div>
  </section>

  <div class="filters" id="venueFilter"></div>
  <div class="section-t">レースを選ぶ</div>
  <div class="racebar" id="raceBar"></div>

  <div id="panel"></div>

  <div class="foot" id="foot"></div>
</div>

<script id="DATA" type="application/json">__RACE_DATA__</script>
<script>
/* ===================== renderer ===================== */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const FLAB = {recent_form:'近走成績',class_fit:'クラス実績',distance_fit:'距離適性',course_fit:'コース適性',
  surface_fit:'馬場適性',going_fit:'馬場状態',weather_fit:'天候相性',jockey_fit:'騎手相性',
  pace_fit:'脚質決め手',draw_fit:'枠順',condition:'馬体調子'};
const FORD = ['recent_form','class_fit','distance_fit','course_fit','jockey_fit','pace_fit','going_fit','weather_fit','surface_fit','condition','draw_fit'];
const state = {venue:'ALL', race:0};

function wakuClass(no,field){ // approximate gate colour from horse number
  if(!no||!field) return ''; const w=Math.min(8,Math.ceil(no/Math.ceil(field/8)||1)); return 'w'+w; }
function fc(v){ // factor bar colour by magnitude (single-hue, thresholds are secondary encoding via shade)
  if(v>=60) return 'var(--turf)'; if(v>=52) return 'var(--turf-dim)'; if(v>=46) return 'var(--slate)'; return 'var(--coral)'; }
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* -- backtest / headline stats -- */
function computeStats(){
  const races=DATA.races; let scored=0,winHit=0,plcHit=0,bestVal=null,roi=0,roiN=0;
  races.forEach(rp=>{
    const res=rp.race.result||{}; const has=Object.keys(res).length>0;
    const top=rp.horses[0];
    if(has&&top){ scored++; const f=res[top.horse_id];
      if(f===1) winHit++; if(f&&f<=3) plcHit++;
      // ROI of the single win recommendation
      if(top.odds){ roiN++; roi += (f===1? top.odds:0); }
    }
    rp.horses.forEach(h=>{ if(h.value!=null && (!bestVal||h.value>bestVal.value)) bestVal={...h,race:rp.race}; });
  });
  return {n:races.length,scored,winHit,plcHit,bestVal,
    roi: roiN? Math.round(roi/roiN*100):null,
    winPct: scored? Math.round(winHit/scored*100):null,
    plcPct: scored? Math.round(plcHit/scored*100):null};
}
function renderStats(){
  const s=computeStats();
  const cards=[];
  cards.push(['分析レース数',s.n,DATA.venues.join(' / '),'turf']);
  if(s.scored){
    cards.push(['◎の複勝的中率', s.plcPct+'%', `本命が3着内 ${s.plcHit}/${s.scored}R`,'gold']);
    cards.push(['◎の単勝的中率', s.winPct+'%', `本命が勝利 ${s.winHit}/${s.scored}R`,'sky']);
  }else{
    cards.push(['ファクター数','11','多角的にスコアリング','sky']);
  }
  if(s.bestVal && s.bestVal.value>0){
    cards.push(['今週の妙味No.1', s.bestVal.horse_name.slice(0,7), `${s.bestVal.race.venue}${s.bestVal.race.race_no}R・EV${(s.bestVal.win_prob*s.bestVal.odds).toFixed(2)}`,'gold']);
  }else{
    cards.push(['推奨馬券','自動生成','単複〜3連複まで','turf']);
  }
  document.getElementById('statGrid').innerHTML=cards.map(c=>
    `<div class="stat ${c[3]}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${esc(c[2])}</div></div>`).join('');
}

function renderVenues(){
  const vs=['ALL',...DATA.venues];
  document.getElementById('venueFilter').innerHTML=vs.map(v=>
    `<div class="chip ${state.venue===v?'on':''}" data-v="${v}">${v==='ALL'?'すべての開催':v+'競馬場'}</div>`).join('');
  document.querySelectorAll('#venueFilter .chip').forEach(c=>c.onclick=()=>{
    state.venue=c.dataset.v; const list=filtered(); state.race=list.length?DATA.races.indexOf(list[0]):0; renderAll();});
}
function filtered(){ return DATA.races.filter(r=>state.venue==='ALL'||r.race.venue===state.venue); }

function renderRaceBar(){
  const list=filtered();
  document.getElementById('raceBar').innerHTML=list.map(rp=>{
    const i=DATA.races.indexOf(rp); const r=rp.race,top=rp.horses[0];
    const res=r.result||{}; let hit='';
    if(Object.keys(res).length && top){ const f=res[top.horse_id]; hit=`<span class="hitdot">${f===1?'🎯':f&&f<=3?'✅':'—'}</span>`;}
    const g=r.grade&&r.grade!=='OP'?`<span class="gtag">${r.grade}</span>`:(r.grade==='OP'?'<span class="gtag" style="background:var(--slate)">OP</span>':'');
    return `<div class="racecard ${state.race===i?'on':''}" data-i="${i}">
      ${g||hit}
      <div class="vn">${r.venue} ${r.race_no}R</div>
      <div class="nm">${esc(r.name||'—')}</div>
      <div class="cd">${r.surface||''}${r.distance||''}m ${r.off_time||''}</div>
      <div class="pick">${top?top.confidence+' '+esc(top.horse_name.slice(0,8)):''}</div>
    </div>`;}).join('');
  document.querySelectorAll('#raceBar .racecard').forEach(c=>c.onclick=()=>{state.race=+c.dataset.i;renderAll();});
}

function factorBars(h){
  return FORD.filter(k=>k in h.factors).map(k=>{
    const v=h.factors[k];
    return `<div class="frow"><span class="fl">${FLAB[k]}</span>
      <span class="ft"><i style="width:${Math.max(4,Math.min(100,v))}%;background:${fc(v)}"></i></span>
      <span class="fv">${Math.round(v)}</span></div>`;}).join('');
}
function comments(h){
  if(!h.comments||!h.comments.length) return '';
  return `<div class="comments">${h.comments.map(c=>
    `<div class="cmt ${c.persona}"><div class="ic">${c.icon}</div>
     <div class="bd"><div class="nm">${esc(c.name)}</div><div class="tx">${esc(c.text)}</div></div></div>`).join('')}</div>`;
}
function horseRow(h,r,idx){
  const res=r.result||{}; const fin=res[h.horse_id];
  const mk=['m0','m1','m2','m3','m4'][idx]||'mx';
  const val=h.value; const vtag = h.odds? (val>0.05?`<span class="valtag pos">妙味 +${(val*100).toFixed(0)}%</span>`
      : `<span class="valtag neg">妙味 ${(val*100).toFixed(0)}%</span>`):'';
  const finTag = fin? `<span class="fin ${fin<=3?'top':''}">実${fin}着</span>`:'';
  return `<div class="horse ${fin===1?'win':''}" data-h="${idx}">
    <div class="hmain">
      <div class="mark ${mk}">${h.confidence||idx+1}</div>
      <div class="num ${wakuClass(h.horse_no,r.field_size)}">${h.horse_no||'-'}</div>
      <div class="hinfo">
        <div class="nm">${esc(h.horse_name)} ${finTag}</div>
        <div class="jk">鞍上 <b>${esc(h.jockey||'—')}</b> ・ 能力指数 ${h.ability}</div>
        <div class="abil"><i style="width:${Math.min(100,Math.max(3,(h.ability-40)*2.2))}%"></i></div>
      </div>
      <div class="odds-col">
        <div class="winp"><div class="p">${Math.round(h.win_prob*100)}<span style="font-size:12px">%</span></div><div class="l">勝率</div></div>
        <div class="odds"><div class="p">${h.odds?h.odds.toFixed(1):'—'}</div><div class="l">単勝</div></div>
        ${vtag}
      </div>
    </div>
    <div class="hdetail">
      <div class="factorgrid">${factorBars(h)}</div>
      ${comments(h)}
    </div>
  </div>`;
}

function renderPanel(){
  const rp=DATA.races[state.race]; if(!rp){document.getElementById('panel').innerHTML='';return;}
  const r=rp.race;
  const conds=[
    r.surface&&`<span class="pill turf">${r.surface}${r.distance||''}m${r.direction||''}</span>`,
    r.weather&&`<span class="pill sky">天候 ${r.weather}</span>`,
    r.going&&`<span class="pill">馬場 ${r.going}</span>`,
    r.grade&&`<span class="pill gold">${r.grade}</span>`,
    r.off_time&&`<span class="pill">発走 ${r.off_time}</span>`,
  ].filter(Boolean).join('');
  const warns = rp.data_warnings&&rp.data_warnings.length? `<div class="warns">
    <div class="h">⚠ データの注意点（足りないもの）</div><ul>${rp.data_warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:'';
  const bets = (rp.bets||[]).map(b=>{
    const ev=b.expected_value; const cls=ev>=2?'hi':ev>=1.1?'mid':'';
    return `<div class="ticket t-${b.bet_type}">
      <div class="tt"><span class="bt">${b.bet_type}</span><span class="ev ${cls}">×${ev}</span></div>
      <div class="sel">${esc(b.selection)}</div>
      <div class="meta"><span>推奨 ${b.stake_units}u</span><span>的中 ${Math.round(b.hit_prob*100)}%</span></div>
      <div class="rat">${esc(b.rationale)}</div></div>`;}).join('');

  document.getElementById('panel').innerHTML=`<div class="panel">
    <div class="rhead">
      <h2>${r.venue} ${r.race_no}R ${esc(r.name||'')}</h2>
      <div class="cond">${conds}</div>
    </div>
    <div class="banner">
      <div class="b verdict"><div class="lab">AI総合ジャッジ ・ ${esc(rp.confidence_level||'')}</div>${esc(rp.race_comment||'')}</div>
      <div class="b pace"><div class="lab">🐎 展開ラボ ・ ペース想定</div>${esc(rp.pace_scenario||'展開分析データ不足')}</div>
    </div>
    <div class="section-t" style="margin:18px 0 8px">予想オーダー（クリックで根拠を展開）</div>
    ${rp.horses.map((h,i)=>horseRow(h,r,i)).join('')}
    <div class="betsec">
      <div class="section-t" style="margin:0 0 10px">💰 推奨馬券プラン</div>
      <div class="tickets">${bets||'<div style="color:var(--muted)">条件を満たす推奨馬券がありません</div>'}</div>
    </div>
    ${warns}
    <div class="legend">
      <span><span class="dot" style="background:var(--gold)"></span>◎本命</span>
      <span><span class="dot" style="background:var(--turf)"></span>◯対抗</span>
      <span><span class="dot" style="background:var(--sky)"></span>▲単穴</span>
      <span><span class="dot" style="background:var(--violet)"></span>☆連下</span>
      <span>🎯=◎的中(勝) ✅=◎3着内</span>
    </div>
  </div>`;
  document.querySelectorAll('#panel .horse').forEach(el=>el.querySelector('.hmain').onclick=()=>el.classList.toggle('open'));
  if(rp.horses[0]) document.querySelector('#panel .horse')?.classList.add('open');
}

function renderAll(){renderVenues();renderRaceBar();renderPanel();
  document.querySelectorAll('#venueFilter .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===state.venue));}

function renderFoot(){
  const d=DATA.generated_for||[];
  document.getElementById('weekBadge').innerHTML = d.length? `対象 <b>${d[0]}〜${d[d.length-1]}</b>`:'今週末を予想';
  document.getElementById('foot').innerHTML=`データ提供: netkeiba (実データ) ・ 予想はAIによる参考情報です。馬券は自己責任で。<br>
    <b>月〜金でその週末の出走レースを分析</b>し、確定オッズ・馬場・天候で自動更新されます。`;
}

/* theme */
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement; r.dataset.theme = r.dataset.theme==='light'?'':'light';};

renderStats();renderAll();renderFoot();
</script>
